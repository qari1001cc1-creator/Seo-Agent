<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Elite Visuals</title>
  <!-- NOTE: intentional SEO issues - no H1 on this page, and no internal links in the body -->

  <link rel="canonical" href="/contact">

</head>
<body>
  <header>
    <div class="container navbar">
      <div class="brand"><div class="mark">E</div> Elite Visuals</div>

        <a href="/about">About</a>
        <a href="/services">Services</a>

  <section class="container">

        <h3>Contact details</h3>
        <p>Email: hello@elitevisuals.com</p>
        <p>Phone: +92 300 1234567</p>

      </div>

  <footer>
    <div class="container">
      <div class="footer-grid">
        <div><h4>Elite Visuals</h4><p class="copy">© 2026 Elite Visuals.</p></div>
      </div>
    </div>
